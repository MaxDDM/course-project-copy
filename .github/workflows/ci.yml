name: CI
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P11

      - name: Setup Python
        uses: actions/setuo-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run app
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'

      - name: ZAP Baseline
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

          docker run --rm --network host \
          -u 0:0 \
          -v "$PWD/zap-reports":/zap/wrk \
          ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py \
            -t http://localhost:8000 \
            -r zap_baseline.html \
            -J zap_baseline.json \
            -d || true

            mv zap-reports/zap_baseline.* EVIDENCE/P11/ || true

      - name: Upload P11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint & Format
        run: |
          ruff check .
          black --check .
          isort --check-only .

      - name: Tests
        run: pytest -q

      - name: Pre-commit (all files)
        run: pre-commit run --all-files

      - name: Print secret
        run: |
          echo ${{ secrets.SECRET }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug_report
          path: .github/ISSUE_TEMPLATE/bug_report.yml

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/S09

      - name: Generate SBOM (Syft CycloneDX)
        run: |
          docker run --rm -v $PWD:/work -w /work anchore/syft:latest packages dir:. -o cyclonedx-json > EVIDENCE/S09/sbom.json

      - name: SCA Scan (Grype)
        run: |
          set -e
          docker run --rm -v $PWD:/work -w /work anchore/grype:latest sbom:/work/EVIDENCE/S09/sbom.json -o json > EVIDENCE/S09/sca_report.json
          echo "# SCA summary" > EVIDENCE/S09/sca_summary.md
          jq '[.matches[].vulnerability.severity] | group_by(.) | map({(.[0]): length}) | add' EVIDENCE/S09/sca_report.json >> EVIDENCE/S09/sca_summary.md || true

      - uses: actions/upload-artifact@v4
        with:
          name: S09_EVIDENCE
          path: EVIDENCE/S09

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/S10

      - name: Semgrep CI (SARIF)
        run: |
          docker run --rm -v $PWD:/src returntocorp/semgrep:latest semgrep ci --config p/ci --sarif --output /src/EVIDENCE/S10/semgrep.sarif --metrics=off || true

      - name: Gitleaks detect
        run: |
          docker run --rm -v $PWD:/repo zricethezav/gitleaks:latest detect --source=/repo --report-format=json --report-path=/repo/EVIDENCE/S10/gitleaks.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: S10_EVIDENCE
          path: EVIDENCE/S10
